brick_name: aopwikirdf-kg
description: RDF knowledge graph of Adverse Outcome Pathways from AOP-Wiki
source:
  - name: AOP-Wiki (OECD)
    url: https://aopwiki.org
    citation: Martens et al. (2022) Applied In Vitro Toxicology (AOP-Wiki RDF dataset)
    license: CC BY 4.0
dtransformations: |
  - Extracted all AOP-Wiki content and converted to RDF triples using ontologies
  - Provided as a pre-computed knowledge graph in HDT format
assets:
  - file: aopwiki.hdt
    format: HDT
    description: Knowledge graph of AOP-Wiki (all AOP entities and relationships)
